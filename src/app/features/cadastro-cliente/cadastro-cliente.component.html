<div class="container">
  <h3>Autocadastro de Cliente</h3>
  <form (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-12">
        <label for="nome" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="nome" name="nome" [(ngModel)]="cliente.nome" required>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" [(ngModel)]="cliente.email" required>
      </div>
      <div class="col-md-3">
        <label for="cpf" class="form-label">CPF</label>
        <input type="text" 
        class="form-control" 
        id="cpf" 
        name="cpf" 
        [(ngModel)]="cliente.cpf" 
        mask="000.000.000-00"
        placeholder="000.000.000-00"
        appGeralValidator="cpf"
        required>
      </div>
      <div class="col-md-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="text" 
        class="form-control" 
        id="telefone" 
        name="telefone" 
        [(ngModel)]="cliente.telefone" 
        mask="(00) 00000-0000"
        placeholder="(00) 00000-0000"
        required>
      </div>
    </div>
    <hr>
    <h5>Endereço</h5>
    <div class="row">
      <div class="col-md-3">
        <label for="cep" class="form-label">CEP</label>
        <input 
        type="text" 
        class="form-control" 
        id="cep" 
        name="cep" 
        [(ngModel)]="cliente.cep"  
        mask="00000-000"
        placeholder="00000-000"
        (blur)="buscarCep()"
        required>
      </div>
      <div class="col-md-7">
        <label for="logradouro" class="form-label">Logradouro / Rua</label>
        <input type="text" class="form-control" id="logradouro" name="logradouro" [(ngModel)]="cliente.logradouro" required>
      </div>
      <div class="col-md-2">
        <label for="numero" class="form-label">Número</label>
        <input type="text" class="form-control" id="numero" name="numero" [(ngModel)]="cliente.numero" required>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <label for="complemento" class="form-label">Complemento</label>
        <input type="text" class="form-control" id="complemento" name="complemento" [(ngModel)]="cliente.complemento">
      </div>
      <div class="col-md-4">
        <label for="bairro" class="form-label">Bairro</label>
        <input type="text" class="form-control" id="bairro" name="bairro" [(ngModel)]="cliente.bairro" required>
      </div>
      <div class="col-md-4">
        <label for="cidade" class="form-label">Cidade</label>
        <input type="text" class="form-control" id="cidade" name="cidade" [(ngModel)]="cliente.cidade" required>
      </div>
      <div class="col-md-1">
        <label for="uf" class="form-label">UF</label>
        <input type="text" class="form-control" id="uf" name="uf" [(ngModel)]="cliente.uf" maxlegth="2" required>
      </div>
    </div>
    <br>
    <button type="submit" class="btn btn-primary">Finalizar Cadastro</button>
  </form>
</div>
