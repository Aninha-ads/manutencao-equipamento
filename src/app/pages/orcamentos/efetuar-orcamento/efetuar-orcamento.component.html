<div class="orcamento-page">
    <div class="container mt-4 mb-5">

    <div class="mb-4">
        <h2>Efetuar Orçamento</h2>
        <p class="text-muted">
            Confira os dados da solicitação e informe o valor do orçamento.
        </p>
    </div>

    <!-- DADOS DA SOLICITAÇÃO -->
    <div class="card mb-4">
        <div class="card-header">
            <strong>Dados da Solicitação</strong>
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-4">
                    <label class="form-label">Data/Hora da solicitação</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="solicitacao.dataHora"
                        readonly>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Categoria</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="solicitacao.categoria"
                        readonly>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="solicitacao.estado"
                        readonly>
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-12">
                    <label class="form-label">Descrição do equipamento</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="solicitacao.equipamento"
                        readonly>
                </div>

            </div>

            <div class="row">

                <div class="col-md-12">
                    <label class="form-label">Descrição do defeito</label>

                    <textarea
                        class="form-control"
                        rows="3"
                        [value]="solicitacao.defeito"
                        readonly></textarea>
                </div>

            </div>

        </div>
    </div>


    <!-- DADOS DO CLIENTE -->
    <div class="card mb-4">

        <div class="card-header">
            <strong>Dados do Cliente</strong>
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="cliente.nome"
                        readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">CPF</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="cliente.cpf"
                        readonly>
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="cliente.email"
                        readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Telefone</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="cliente.telefone"
                        readonly>
                </div>

            </div>

            <div class="row">

                <div class="col-md-12">
                    <label class="form-label">Endereço</label>
                    <input
                        type="text"
                        class="form-control"
                        [value]="cliente.endereco"
                        readonly>
                </div>

            </div>

        </div>
    </div>


    <!-- ORÇAMENTO -->
    <div class="card">

        <div class="card-header">
            <strong>Orçamento</strong>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">
                    <label for="valorOrcamento" class="form-label">
                        Valor do orçamento
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">R$</span>

                        <input
                            id="valorOrcamento"
                            type="text"
                            class="form-control"
                            name="valorOrcamento"
                            [(ngModel)]="valorOrcamento"
                            placeholder="0,00"
                            inputmode="decimal"
                            required>
                    </div>

                    <small class="form-text text-muted">
                        Informe o valor total para execução do serviço.
                    </small>
                </div>

            </div>

        </div>

        <div class="card-footer d-flex justify-content-end gap-2">

            <a
                class="btn btn-secondary"
                routerLink="/painel-cliente">
                Cancelar
            </a>

            <button
                type="button"
                class="btn btn-primary"
                (click)="registrarOrcamento()">
                Registrar Orçamento
            </button>

        </div>

        </div>
    </div>

</div>
