<div class="container mt-4 mb-5">

    <!-- TÍTULO -->
    <div class="mb-4">
        <h2>Redirecionar Manutenção</h2>

        <p class="text-muted">
            Selecione o funcionário que ficará responsável
            pela continuidade da manutenção.
        </p>
    </div>


    <!-- DADOS DA SOLICITAÇÃO -->
    <div class="card mb-4">

        <div class="card-header">
            <strong>Dados da Solicitação</strong>
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-6">
                    <label class="form-label">
                        Equipamento
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="Notebook Dell Inspiron 15"
                        readonly>
                </div>


                <div class="col-md-3">
                    <label class="form-label">
                        Categoria
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="Notebook"
                        readonly>
                </div>


                <div class="col-md-3">
                    <label class="form-label">
                        Estado Atual
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="APROVADA"
                        readonly>
                </div>

            </div>


            <div class="row">

                <div class="col-md-12">

                    <label class="form-label">
                        Descrição do Defeito
                    </label>

                    <textarea
                        class="form-control"
                        rows="3"
                        readonly>Notebook não liga e não apresenta sinal ao pressionar o botão de energia.</textarea>

                </div>

            </div>

        </div>

    </div>


    <!-- REDIRECIONAMENTO -->
    <div class="card">

        <div class="card-header">
            <strong>Redirecionamento</strong>
        </div>


        <div class="card-body">

            <!-- FUNCIONÁRIO ATUAL -->
            <div class="row mb-4">

                <div class="col-md-6">

                    <label class="form-label">
                        Funcionário Responsável Atual
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="Maria"
                        readonly>

                </div>

            </div>


            <!-- FUNCIONÁRIO DESTINO -->
            <div class="row">

                <div class="col-md-6">

                    <label
                        for="funcionarioDestino"
                        class="form-label">

                        Redirecionar para

                    </label>

                    <select
                        id="funcionarioDestino"
                        name="funcionarioDestino"
                        class="form-select">

                        <option value="">
                            Selecione um funcionário
                        </option>

                        <option value="2">
                            Mário
                        </option>

                    </select>

                    <small class="form-text text-muted">
                        Selecione outro funcionário para assumir a manutenção.
                    </small>

                </div>

            </div>

        </div>


        <!-- BOTÕES -->
        <div class="card-footer d-flex justify-content-end gap-2">

            <button
                type="button"
                class="btn btn-secondary"
                routerLink="/manutencoes/efetuar">

                Cancelar

            </button>


            <button
                type="button"
                class="btn btn-warning">

                Redirecionar Manutenção

            </button>

        </div>

    </div>

</div>
